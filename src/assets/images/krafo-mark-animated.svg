     class="krafo" role="img" aria-label="Krafo">
  <title>Krafo</title>
  <style>
    .krafo *{transform-box:view-box;transform-origin:50% 50%}
    .rotor{animation:turn 14s linear infinite}
    .blades path{transition:transform .55s cubic-bezier(.34,1.32,.5,1);
                 transition-delay:calc(var(--i) * 32ms)}
    .ring{transition:transform .55s cubic-bezier(.34,1.32,.5,1)}
    .core{transition:transform .45s cubic-bezier(.34,1.5,.5,1)}
    svg:hover .blades path{transform:rotate(-18deg) scale(.86)}
    svg:hover .ring{transform:scale(1.05)}
    svg:hover .core{transform:scale(1.16)}
    @keyframes turn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.rotor{animation:none}}
  </style>
